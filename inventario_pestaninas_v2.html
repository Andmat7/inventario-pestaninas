<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111a">
<title>Conteo de pestañinas · Panel</title>
<style>
  :root{
    --bg:#14111a; --panel:#1d1926; --panel-2:#262033; --ink:#f4effa; --muted:#a49cb3; --line:#332b42;
    --acc:#b197fc; --acc-2:#e599f7; --ok:#69db7c; --warn:#ffd43b; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .wrap{max-width:980px;margin:0 auto;padding:0 14px}
  header{padding:20px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hello{color:var(--muted);font-size:.8rem;text-transform:capitalize}
  h1{margin:2px 0 0;font-size:1.7rem;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc-2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
  .ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--panel-2) 0);display:grid;place-items:center;flex:none}
  .ring span{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.8rem}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:14px;padding:4px;margin:12px 0;position:sticky;top:8px;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .seg button{border:0;background:none;color:var(--muted);padding:10px 4px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer}
  .seg button.on{background:var(--panel-2);color:var(--ink)}
  .searchbar{display:flex;gap:8px;margin-bottom:12px}
  .searchbar input,.searchbar select{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;outline:none}
  .searchbar input{flex:1;min-width:0}
  .searchbar input:focus{border-color:var(--acc)}
  .group{background:var(--panel);border-radius:var(--r);margin-bottom:12px;overflow:hidden;border:1px solid var(--line)}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:14px;cursor:pointer;user-select:none}
  .ghead small{color:var(--muted);font-size:.75rem}
  .pill{background:var(--panel-2);border-radius:999px;padding:4px 10px;font-size:.75rem;color:var(--muted)}
  .pill.full{background:#1f3a26;color:var(--ok)}
  .chev{transition:transform .2s;color:var(--muted);margin-left:8px}
  .group.closed .chev{transform:rotate(-90deg)}
  .group.closed .rows{display:none}
  .r{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
  .r .cnt{grid-column:1/-1;justify-content:flex-end}
  .stack{position:relative;width:64px;height:64px;cursor:zoom-in;flex:none}
  .stack img{display:block;object-fit:cover;background:var(--panel-2)}
  .stack .big{width:58px;height:58px;border-radius:14px}
  .stack .small{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:8px;border:2px solid var(--panel)}
  .viewer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}
  .viewer figure{margin:0}
  .viewer img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:16px;background:#fff;display:block}
  .viewer figcaption{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:600}
  .r .n{font-size:.9rem;font-weight:600;line-height:1.25}
  .r .c{font-size:.72rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .r.flash{background:#2b2240}
  .cnt{display:flex;align-items:center;gap:6px}
  .cnt input{width:68px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 6px;font-size:16px;text-align:center;font-weight:800}
  .cnt input.has{border-color:var(--acc)}
  .cnt button{width:36px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:1.1rem;cursor:pointer}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .kpi span{font-size:.75rem;color:var(--muted)}
  .kpi b{display:block;font-size:1.5rem;margin-top:4px;font-variant-numeric:tabular-nums}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:.9rem}
  .line{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:.85rem}
  .line:first-of-type{border-top:0}
  .muted{color:var(--muted);font-size:.8rem}
  .note{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;min-height:70px;font-family:inherit;resize:vertical}
  .sent{background:#1f3a26;color:var(--ok);border-radius:var(--r);padding:14px;margin-bottom:12px;font-weight:700}
  .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(20,17,26,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
  .bottom .wrap{display:flex;gap:8px;padding:0}
  .bbtn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:.95rem;cursor:pointer}
  .bbtn.p{background:linear-gradient(90deg,var(--acc),var(--acc-2));color:#1a1024}
  .bbtn.s{background:var(--panel-2);color:var(--ink);flex:0 0 auto;padding:14px 16px}
  .bbtn.wa{background:#25d366;color:#08331a}
  dialog{border:0;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:var(--panel);color:var(--ink);width:100%;max-width:520px;margin:auto auto 0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{margin:0 0 12px;font-size:1.1rem}
  .stores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stores button{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:14px;font-size:.95rem;cursor:pointer}
  .f{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;margin-top:10px}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:700;opacity:0;transition:.2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (min-width:760px){
    .groups{columns:2;column-gap:12px}
    .group{break-inside:avoid}
    .kpis{grid-template-columns:repeat(4,1fr)}
    dialog{border-radius:22px;margin:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="hello" id="today"></div>
      <h1 id="hola" title="Cambiar tienda">Hola 👋</h1>
    </div>
    <div class="ring" id="ring"><span id="ringTxt">0%</span></div>
  </header>

  <div class="seg" id="seg">
    <button class="on" data-tab="count">Contar</button>
    <button data-tab="send">Revisar y enviar</button>
  </div>

  <section id="tab-count">
    <div class="searchbar">
      <input id="q" type="search" placeholder="🔍 Buscar o escanear código" autocomplete="off" enterkeyhint="go">
      <select id="fl" aria-label="Filtro"><option value="all">Todos</option><option value="pend">Sin contar</option><option value="done">Contados</option></select>
    </div>
    <div class="groups" id="groups"></div>
  </section>

  <section id="tab-send" hidden>
    <div id="sentBox"></div>
    <div class="kpis">
      <div class="kpi"><span>Contados</span><b id="kC">0</b></div>
      <div class="kpi"><span>Unidades</span><b id="kU">0</b></div>
      <div class="kpi"><span>Sin contar</span><b id="kP" style="color:var(--warn)">0</b></div>
      <div class="kpi"><span>En cero</span><b id="kZ">0</b></div>
    </div>
    <div class="card"><h3>Por marca</h3><div id="byBrand"></div></div>
    <div class="card" id="pendCard"><h3>⏳ Sin contar</h3><div id="pend"></div></div>
    <div class="card"><h3>Observaciones</h3><textarea class="note" id="note" placeholder="Ej: llegaron 2 cajas sin abrir, faltó revisar bodega…"></textarea></div>
  </section>
</div>

<div class="bottom"><div class="wrap" id="bottom"></div></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
const PRODUCTS = [
  ["P303","P303","Primer Pestañas Esika","Esika"],
  ["200118939","P1532","Mascara De Pestañas Magnetic Lash","Cyzone"],
  ["200109566","P1533","Mascara De Pestañas Max Volume Lash","Cyzone"],
  ["200119225","P545","Mascara de pestañas Ultra Curl Lash Studio Look","Cyzone"],
  ["200116082","P426","Mega Benefit Mega Mascara de Pestañas","Esika"],
  ["P460","P460","Mega Full Curve Mascara de Pestañas a Prueba de Agua","Esika"],
  ["200117468","P1129","Mega Full Size Máscara de Pestañas a Prueba de Agua","Esika"],
  ["00200117467","P1128","Mega Full Size Máscara de Pestañas Fácil Retirado","Esika"],
  ["200121137","P1130","Mega Full Volume 4D Máscara de Pestañas","Esika"],
  ["200116194","P1131","Mega Full Volume Máscara de Pestañas","Esika"],
  ["200116110","P1132","Mega Tubing Extensions Máscara de Pestañas","Esika"],
  ["000200105071","P164","Máscara tratante y sérum para pestañas 6 g","Lbel"],
  ["P477","P477","Mega Black Mascara de Pestañas","Maquillaje"],
  ["0014373","P157","Mascara De Pestañas Crece Extreme","Yanbal"],
  ["0014390","P1583","Mascara De Pestañas Iron Infinity","Yanbal"],
  ["0014157","P1581","Mascara De Pestañas Super Lift","Yanbal"],
  ["0014158","P1582","Mascara De Pestañas Ultra Resist","Yanbal"],
  ["0013768","P535","Mascara De Pestañas XL","Yanbal"]
].map(([barcode,code,name,brand])=>({barcode,code,name,brand}));
const TIENDAS=["Soacha","Bosa","Kennedy","Suba"]; // ajusta tus tiendas

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const z=s=>String(s).replace(/^0+/,"");
const hoy=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
// Fotos por defecto (las mismas para todos): img/empacada.jpg e img/imagen_tienda.jpg.
// Para dar foto propia a un producto, agrégalo aquí, ej: P1532:{caja:"img/P1532_caja.jpg",tienda:"img/P1532_tienda.jpg"}
const FOTOS_DEFECTO={caja:"img/empacada.jpg",tienda:"img/imagen_tienda.jpg"};
const FOTOS={};
const foto=(p,kind)=>(FOTOS[p.code]&&FOTOS[p.code][kind])||FOTOS_DEFECTO[kind];
const BRAND_COLORS={Esika:"#ff922b",Cyzone:"#f06595",Yanbal:"#9775fa",Lbel:"#adb5bd",Maquillaje:"#3bc9db"};
function placeholder(code,brand,kind){
  const c=BRAND_COLORS[brand]||"#868e96";
  const art=kind==="caja"
    ? `<path d="M28 38 L50 28 L72 38 L72 70 L50 80 L28 70 Z" fill="${c}" opacity=".9"/><path d="M28 38 L50 48 L72 38 M50 48 L50 80" stroke="#14111a" stroke-width="2" fill="none" opacity=".5"/>`
    : `<rect x="44" y="18" width="12" height="20" rx="3" fill="#f4effa"/><rect x="41" y="36" width="18" height="44" rx="6" fill="${c}"/><rect x="45" y="44" width="3" height="28" rx="1.5" fill="#fff" opacity=".5"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#262033"/>${art}<text x="50" y="94" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="${c}">${code}</text></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}
function imgFallback(el){
  // 1) foto propia  2) foto por defecto  3) dibujo SVG
  if(!el.dataset.ph){el.dataset.ph=1;el.src=FOTOS_DEFECTO[el.dataset.kind]}
  else{el.onerror=null;el.src=placeholder(el.dataset.code,el.dataset.brand,el.dataset.kind)}
}
function imgTag(p,kind,cls=""){
  return `<img class="${cls}" loading="lazy" alt="${esc(p.name)} (${kind})" src="${foto(p,kind)}" data-code="${esc(p.code)}" data-brand="${esc(p.brand)}" data-kind="${kind}" onerror="imgFallback(this)">`;
}
function openViewer(code){
  const p=PRODUCTS.find(x=>x.code===code);if(!p)return;
  const d=$("#dlg"),c=C.counts[p.code];
  d.innerHTML=`<h2 style="margin-bottom:2px">${esc(p.name)}</h2><div class="muted">${esc(p.brand)} · ${esc(p.code)} · ${esc(p.barcode)}</div>
    <div class="viewer"><figure>${imgTag(p,"caja")}<figcaption>📦 Empacada</figcaption></figure><figure>${imgTag(p,"tienda")}<figcaption>🏬 En la tienda</figcaption></figure></div>
    <div class="cnt" style="justify-content:center;margin-top:12px">
      <button data-d="-1" data-c="${esc(p.code)}" data-keep="1">−</button>
      <input class="${c!=null?"has":""}" type="number" inputmode="numeric" min="0" placeholder="–" value="${c??""}" data-in="${esc(p.code)}" id="vq">
      <button data-d="1" data-c="${esc(p.code)}" data-keep="1">+</button></div>
    <button class="bbtn s" style="width:100%;margin-top:14px" id="closeV">Cerrar</button>`;
  $("#closeV").onclick=()=>d.close();
  d.showModal();
}

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}

const urlTienda=new URLSearchParams(location.search).get("tienda");
if(urlTienda)localStorage.setItem("pest_tienda",urlTienda);
let tienda=localStorage.getItem("pest_tienda")||"";
const key=()=>`pest_conteo_v2_${norm(tienda)}_${hoy()}`;
const load=()=>JSON.parse(localStorage.getItem(key())||"null")||{counts:{},note:"",sentAt:null};
let C=load(),tab="count";
const closed=JSON.parse(localStorage.getItem("pest_closed")||"{}");
const save=()=>localStorage.setItem(key(),JSON.stringify(C));
function setCount(code,v){if(v===""||v==null)delete C.counts[code];else C.counts[code]=Math.max(0,parseInt(v)||0);C.sentAt=null;save()}

function grouped(items){const g={};items.forEach(p=>(g[p.brand]??=[]).push(p));return Object.entries(g)}
function list(){
  const q=norm($("#q").value.trim()),f=$("#fl").value;
  return PRODUCTS.filter(p=>{
    if(f==="pend"&&C.counts[p.code]!=null)return false;
    if(f==="done"&&C.counts[p.code]==null)return false;
    return !q||norm(p.name+" "+p.code+" "+p.brand).includes(q)||z(p.barcode).includes(z(q));
  });
}
function renderHead(){
  $("#hola").textContent=tienda?`Hola ${tienda} 👋`:"Hola 👋";
  $("#today").textContent=new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
  const pct=Math.round(Object.keys(C.counts).length/PRODUCTS.length*100);
  $("#ring").style.setProperty("--p",pct);$("#ringTxt").textContent=pct+"%";
}
function renderCount(){
  $("#groups").innerHTML=grouped(list()).map(([b,ps])=>{
    const all=PRODUCTS.filter(p=>p.brand===b),done=all.filter(p=>C.counts[p.code]!=null).length;
    return `<div class="group ${closed[b]?"closed":""}"><div class="ghead" data-g="${esc(b)}">
      <div><b>${esc(b)}</b><br><small>${all.reduce((a,p)=>a+(C.counts[p.code]||0),0)} unidades</small></div>
      <div><span class="pill ${done===all.length?"full":""}">${done}/${all.length}</span><span class="chev">▾</span></div></div>
      <div class="rows">${ps.map(p=>{const c=C.counts[p.code];return `
        <div class="r" data-row="${esc(p.code)}">
        <div class="stack" data-view="${esc(p.code)}" title="Ver fotos">${imgTag(p,"tienda","big")}${imgTag(p,"caja","small")}</div>
        <div data-view="${esc(p.code)}" style="cursor:pointer"><div class="n">${esc(p.name)}</div><div class="c">${esc(p.code)} · ${esc(p.barcode)}</div></div>
        <div class="cnt"><button data-d="-1" data-c="${esc(p.code)}" aria-label="Restar">−</button>
        <input class="${c!=null?"has":""}" type="number" inputmode="numeric" min="0" placeholder="–" value="${c??""}" data-in="${esc(p.code)}">
        <button data-d="1" data-c="${esc(p.code)}" aria-label="Sumar">+</button></div></div>`}).join("")}</div></div>`;
  }).join("")||`<p class="muted" style="text-align:center;padding:30px">${$("#fl").value==="pend"?"¡Todo contado! 🎉":"Sin resultados"}</p>`;
}
function renderSend(){
  const vals=Object.values(C.counts),pend=PRODUCTS.filter(p=>C.counts[p.code]==null);
  $("#sentBox").innerHTML=C.sentAt?`<div class="sent">✓ Conteo de hoy enviado a las ${new Date(C.sentAt).toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"})}</div>`:"";
  $("#kC").textContent=`${vals.length}/${PRODUCTS.length}`;
  $("#kU").textContent=vals.reduce((a,b)=>a+b,0);
  $("#kP").textContent=pend.length;
  $("#kZ").textContent=vals.filter(v=>v===0).length;
  $("#byBrand").innerHTML=grouped(PRODUCTS).map(([b,ps])=>`<div class="line"><span>${esc(b)}</span><b>${ps.reduce((a,p)=>a+(C.counts[p.code]||0),0)} u · ${ps.filter(p=>C.counts[p.code]!=null).length}/${ps.length}</b></div>`).join("");
  $("#pendCard").hidden=!pend.length;
  $("#pend").innerHTML=pend.map(p=>`<div class="line"><span>${esc(p.name)}<br><span class="muted">${esc(p.brand)} · ${esc(p.code)}</span></span></div>`).join("");
  if(document.activeElement!==$("#note"))$("#note").value=C.note||"";
}
function renderBottom(){
  $("#bottom").innerHTML=tab==="count"
    ?`<button class="bbtn s" id="scan">⌁ Escanear</button><button class="bbtn p" id="goSend">Revisar y enviar →</button>`
    :`<button class="bbtn s" id="dl">⬇ CSV</button><button class="bbtn wa" id="wa">Enviar por WhatsApp</button>${navigator.share?`<button class="bbtn s" id="sh">↗</button>`:""}`;
}
function render(){
  renderHead();
  $("#tab-count").hidden=tab!=="count";$("#tab-send").hidden=tab!=="send";
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  tab==="count"?renderCount():renderSend();renderBottom();
}

function reporte(){
  const d=new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric"});
  const vals=Object.values(C.counts);
  let t=`📋 *Conteo pestañinas*\n🏬 Tienda: *${tienda}*\n📅 ${d}\n✅ ${vals.length}/${PRODUCTS.length} referencias · ${vals.reduce((a,b)=>a+b,0)} unidades\n`;
  grouped(PRODUCTS).forEach(([b,ps])=>{t+=`\n*${b}*\n`+ps.map(p=>`• ${p.code} ${p.name}: ${C.counts[p.code]??"SIN CONTAR"}`).join("\n")+"\n"});
  if(C.note?.trim())t+=`\n📝 ${C.note.trim()}`;
  return t.trim()+"\n\n¡Gracias! ✨";
}
function confirmPend(){
  const pend=PRODUCTS.length-Object.keys(C.counts).length;
  return !pend||confirm(`Faltan ${pend} referencias por contar. ¿Enviar de todas formas?`);
}
function sent(){
  C.sentAt=Date.now();save();render();
  const d=$("#dlg"),u=Object.values(C.counts).reduce((a,b)=>a+b,0);
  d.innerHTML=`<div style="text-align:center;padding:12px 0 4px">
    <div style="font-size:3.5rem;line-height:1">✨</div>
    <h2 style="font-size:1.6rem;margin:10px 0 6px;background:linear-gradient(90deg,var(--acc),var(--acc-2));-webkit-background-clip:text;background-clip:text;color:transparent">¡Gracias, ${esc(tienda)}!</h2>
    <p class="muted" style="font-size:.95rem;margin:0">Tu conteo de hoy quedó enviado.<br><b style="color:var(--ink)">${Object.keys(C.counts).length} referencias · ${u} unidades</b></p>
    <button class="bbtn p" style="width:100%;margin-top:20px" id="okG">Listo</button></div>`;
  $("#okG").onclick=()=>d.close();
  if(!d.open)d.showModal();
}
function csv(){
  const rows=[["Tienda","Fecha","Codigo Barra","Codigo","Nombre","Marca","Conteo"],...PRODUCTS.map(p=>[tienda,hoy(),p.barcode,p.code,p.name,p.brand,C.counts[p.code]??""])];
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n")],{type:"text/csv"}));
  a.download=`conteo_pestaninas_${norm(tienda).replace(/\s+/g,"_")}_${hoy()}.csv`;a.click();
}

function askTienda(force){
  if(tienda&&!force)return;
  const d=$("#dlg");
  d.innerHTML=`<h2>¿Qué tienda está contando?</h2><div class="stores">${TIENDAS.map(t=>`<button data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <input class="f" id="otra" placeholder="Otra tienda…"><button class="bbtn p" style="width:100%;margin-top:12px" id="okT">Continuar</button>`;
  d.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>pick(b.dataset.t));
  $("#okT").onclick=()=>{const v=$("#otra").value.trim();if(!v)return toast("Elige o escribe una tienda");pick(v)};
  d.showModal();
}
function pick(t){tienda=t;localStorage.setItem("pest_tienda",t);C=load();$("#dlg").close();render();toast(`Hola ${t} 👋`)}
$("#dlg").addEventListener("cancel",e=>{if(!tienda)e.preventDefault()});
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg")&&tienda)$("#dlg").close()});

$("#seg").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.tab;render()}};
$("#hola").onclick=()=>askTienda(true);
$("#q").oninput=renderCount;$("#fl").onchange=renderCount;
$("#note").oninput=e=>{C.note=e.target.value;C.sentAt=null;save()};
$("#q").onkeydown=e=>{
  if(e.key!=="Enter")return;const v=z(e.target.value.trim());if(!v)return;
  const p=PRODUCTS.find(p=>z(p.barcode)===v||p.code===v.toUpperCase());
  if(!p)return toast("Código no encontrado");
  e.target.value="";setCount(p.code,(C.counts[p.code]??0)+1);closed[p.brand]=false;render();toast(`${p.code}: ${C.counts[p.code]}`);
  const r=document.querySelector(`[data-row="${CSS.escape(p.code)}"]`);if(r){r.classList.add("flash");r.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>r.classList.remove("flash"),900)}
};
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-g]");if(g){closed[g.dataset.g]=!closed[g.dataset.g];localStorage.setItem("pest_closed",JSON.stringify(closed));renderCount();return}
  const d=e.target.closest("[data-d]");if(d){const c=d.dataset.c,cur=C.counts[c];setCount(c,cur==null?(+d.dataset.d>0?1:0):Math.max(0,cur+ +d.dataset.d));render();
    if(d.dataset.keep){$("#vq").value=C.counts[c];$("#vq").classList.add("has")}return}
  const v=e.target.closest("[data-view]");if(v){openViewer(v.dataset.view);return}
  const id=e.target.id;
  if(id==="scan"){$("#q").value="";$("#q").focus();toast("Escanea: cada lectura suma 1")}
  if(id==="goSend"){tab="send";render();window.scrollTo({top:0})}
  if(id==="dl")csv();
  if(id==="wa"){if(!tienda)return askTienda(true);if(!confirmPend())return;window.open("https://wa.me/?text="+encodeURIComponent(reporte()),"_blank");sent()}
  if(id==="sh"){if(!confirmPend())return;try{await navigator.share({title:"Conteo pestañinas "+tienda,text:reporte()});sent()}catch(_){}}
});
document.addEventListener("change",e=>{const c=e.target.dataset?.in;if(c==null)return;setCount(c,e.target.value);render()});

render();askTienda(false);
</script>
</body>
</html>
