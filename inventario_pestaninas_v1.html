<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d81b72">
<title>Conteo de pestañinas</title>
<style>
  :root{
    --bg:#f5f2f4; --card:#fff; --ink:#1f1a1d; --muted:#5f565b; --line:#e3dde0;
    --brand:#e23a85; --brand-2:#d81b72; --pink:#fe9bc7; --soft:#fde3ee; --ok:#2f9e44; --r:18px; --shadow:0 6px 20px rgba(60,20,40,.08);
    --head:linear-gradient(135deg,var(--brand-2),var(--brand)); --head-ink:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding:18px 16px 14px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .hola{font-size:1.5rem;font-weight:800;margin:0;line-height:1.1;cursor:pointer}
  .sub{font-size:.8rem;opacity:.9;margin-top:4px}
  .badge{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 10px;font-size:.75rem;font-weight:700;white-space:nowrap}
  .progress{margin-top:12px;background:rgba(255,255,255,.25);height:8px;border-radius:9px;position:relative}
  .progress i{position:relative;display:block;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.7),#fff);border-radius:9px;transition:width .3s}
  .progress .spark,.progress .sparks{right:0;top:50%;display:none}
  .progress.lit .spark,.progress.lit .sparks{display:block}
  .ptext{display:flex;justify-content:space-between;font-size:.75rem;margin-top:6px;opacity:.95}
  .search{margin-top:12px}
  .search input{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:16px;outline:none;background:#fff;color:var(--ink)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.85rem;cursor:pointer}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  main{padding:8px 16px}
  .list{display:grid;gap:10px}
  .item{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;border:2px solid transparent;transition:border-color .2s}
  .thumbs{display:flex;gap:6px;cursor:zoom-in}
  .thumb{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--soft);flex:none}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:.58rem;font-weight:700;text-align:center;color:#fff;background:rgba(58,15,34,.55);padding:2px 0;letter-spacing:.03em}
  .foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px}
  .foot .lbl{font-size:.75rem;color:var(--muted);font-weight:600}
  .viewer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
  .viewer figure{margin:0}
  .viewer img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:16px;background:#fff;border:1px solid var(--line);display:block}
  .viewer figcaption{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:600}
  .item.done{border-color:#c3e6cb}
  .item.flash{border-color:var(--brand)}
  .name{font-weight:600;font-size:.95rem;line-height:1.25}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.72rem;color:var(--muted)}
  .tag{background:var(--soft);color:var(--brand);padding:2px 8px;border-radius:999px;font-weight:600}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:42px;height:42px;border-radius:12px;border:0;font-size:1.3rem;font-weight:700;cursor:pointer}
  .minus{background:var(--soft);color:var(--brand)}
  .plus{background:var(--brand);color:#fff}
  .qty{width:46px;text-align:center;font-weight:800;font-size:1.2rem;border:0;background:none;color:var(--ink);padding:0}
  .qty::placeholder{color:#f0b3cf}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px}
  .bottom button{border:0;border-radius:14px;padding:15px;font-weight:800;font-size:1rem;cursor:pointer}
  .send{flex:1;background:var(--brand);color:#fff}
  .sec{background:var(--soft);color:var(--brand)}
  .backdrop{position:fixed;inset:0;background:rgba(58,15,34,.45);opacity:0;pointer-events:none;transition:.2s;z-index:9}
  .backdrop.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:10;max-height:90vh;overflow:auto}
  .sheet.open{transform:none}
  .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 12px}
  .sheet h2{margin:0 0 6px;font-size:1.15rem}
  .preview{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem;white-space:pre-wrap;max-height:40vh;overflow:auto;margin:10px 0}
  .warn{background:#fff4e6;color:#a35a00;border-radius:12px;padding:10px 12px;font-size:.85rem;margin-top:8px}
  .btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.wa{background:#25d366;color:#08331a}
  .btn.ghost{background:var(--soft);color:var(--brand)}
  .field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-top:6px}
  .stores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .stores button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:.95rem;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:.85rem;opacity:0;transition:.2s;z-index:20;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (min-width:760px){
    main,.chips{max-width:900px;margin:0 auto}
    .list{grid-template-columns:1fr 1fr}
    .sheet{max-width:520px;margin:0 auto}
  }
  /* Mecha: chispa en el borde del progreso */
  @keyframes chispa{from{scale:.75;filter:brightness(1)}to{scale:1.25;filter:brightness(1.4)}}
  @keyframes chispas{0%{translate:0 0;scale:1;opacity:1}100%{translate:7px -6px;scale:1.8;opacity:0}}
  .spark,.sparks{position:absolute;pointer-events:none}
  .spark{width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle,#fff 0 28%,#ffe066 42%,#ff922b 62%,transparent 72%);box-shadow:0 0 10px 3px rgba(255,190,80,.75);animation:chispa .16s ease-in-out infinite alternate}
  .sparks{width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#ffd43b;box-shadow:6px -6px 0 #ff922b,-4px -9px 0 #fff3bf,8px 5px 0 #ffa94d,-7px 4px 0 #ffe066,2px -12px 0 #fff;animation:chispas .45s linear infinite}
  .reset-opts{display:grid;gap:8px;margin-top:12px}
  .reset-opts button{text-align:left;border-radius:14px;padding:14px;font-size:.95rem;cursor:pointer;line-height:1.3}
  .reset-opts small{display:block;opacity:.75;font-size:.78rem;font-weight:400}
  .reset-opts button{border:1px solid var(--line);background:#fff;color:var(--ink)}
  .reset-opts .danger{background:var(--soft);color:var(--brand);border-color:transparent;font-weight:700}
  /* TEMPORAL: selector de paletas */
  .pal-btn{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:1.3rem;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
  .pal-box{position:fixed;right:14px;bottom:calc(140px + env(safe-area-inset-bottom));z-index:30;width:260px;max-width:calc(100vw - 28px);background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:8px;display:none}
  .pal-box.open{display:block}
  .pal-box h3{margin:6px 8px 8px;font-size:.8rem;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .pal-opt{display:flex;align-items:center;gap:10px;width:100%;border:2px solid transparent;background:none;border-radius:12px;padding:8px;cursor:pointer;text-align:left;font-size:.88rem;color:#222}
  .pal-opt.on{border-color:#222}
  .pal-opt small{display:block;color:#888;font-size:.72rem}
  .pal-sw{display:flex;flex:none}
  .pal-sw i{width:16px;height:28px;display:block}
  .pal-sw i:first-child{border-radius:8px 0 0 8px}.pal-sw i:last-child{border-radius:0 8px 8px 0}
</style>
</head>
<body>

<header>
  <div class="top">
    <div>
      <h1 class="hola" id="hola" title="Cambiar tienda">Hola 👋</h1>
      <div class="sub" id="fecha"></div>
    </div>
    <span class="badge" id="estado">Sin enviar</span>
  </div>
  <div class="progress" id="prog"><i id="bar"><b class="sparks"></b><b class="spark"></b></i></div>
  <div class="ptext"><span id="ptxt">0 de 0 contados</span><span id="units">0 unidades</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar o escanear código…" autocomplete="off" enterkeyhint="search">
  </div>
</header>

<div class="chips" id="chips"></div>
<main><div class="list" id="list"></div></main>

<div class="bottom">
  <button class="sec" id="resetBtn" title="Poner en cero">↺</button>
  <button class="sec" id="scanBtn" title="Escanear">⌁ Escanear</button>
  <button class="send" id="sendBtn">Enviar conteo de hoy</button>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const PRODUCTS = [
  ["P303","P303","Primer Pestañas Esika","Esika"],
  ["200118939","P1532","Mascara De Pestañas Magnetic Lash","Cyzone"],
  ["200109566","P1533","Mascara De Pestañas Max Volume Lash","Cyzone"],
  ["200119225","P545","Mascara de pestañas Ultra Curl Lash Studio Look","Cyzone"],
  ["200116082","P426","Mega Benefit Mega Mascara de Pestañas","Esika"],
  ["P460","P460","Mega Full Curve Mascara de Pestañas a Prueba de Agua","Esika"],
  ["200117468","P1129","Mega Full Size Máscara de Pestañas a Prueba de Agua","Esika"],
  ["00200117467","P1128","Mega Full Size Máscara de Pestañas Fácil Retirado","Esika"],
  ["200121137","P1130","Mega Full Volume 4D Máscara de Pestañas","Esika"],
  ["200116194","P1131","Mega Full Volume Máscara de Pestañas","Esika"],
  ["200116110","P1132","Mega Tubing Extensions Máscara de Pestañas","Esika"],
  ["000200105071","P164","Máscara tratante y sérum para pestañas 6 g","Lbel"],
  ["P477","P477","Mega Black Mascara de Pestañas","Maquillaje"],
  ["0014373","P157","Mascara De Pestañas Crece Extreme","Yanbal"],
  ["0014390","P1583","Mascara De Pestañas Iron Infinity","Yanbal"],
  ["0014157","P1581","Mascara De Pestañas Super Lift","Yanbal"],
  ["0014158","P1582","Mascara De Pestañas Ultra Resist","Yanbal"],
  ["0013768","P535","Mascara De Pestañas XL","Yanbal"]
].map(([barcode,code,name,brand])=>({barcode,code,name,brand}));
const TIENDAS=["Soacha","Bosa","Kennedy","Suba"]; // ajusta tus tiendas

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const z=s=>String(s).replace(/^0+/,"");
const hoy=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};

// Tienda: ?tienda=Soacha en la URL, o la que se eligió antes
const urlTienda=new URLSearchParams(location.search).get("tienda");
if(urlTienda)localStorage.setItem("pest_tienda",urlTienda);
let tienda=localStorage.getItem("pest_tienda")||"";
const key=()=>`pest_conteo_v1_${norm(tienda)}_${hoy()}`;
let C=load();
function load(){return JSON.parse(localStorage.getItem(key())||"null")||{counts:{},sentAt:null}}
const save=()=>localStorage.setItem(key(),JSON.stringify(C));
let brand="Todas";

// Fotos por defecto (las mismas para todos): img/empacada.jpg e img/imagen_tienda.jpg.
// Para dar foto propia a un producto, agrégalo aquí, ej: P1532:{caja:"img/P1532_caja.jpg",tienda:"img/P1532_tienda.jpg"}
const FOTOS_DEFECTO={caja:"img/empacada.jpg",tienda:"img/imagen_tienda.jpg"};
const FOTOS={};
const foto=(p,kind)=>(FOTOS[p.code]&&FOTOS[p.code][kind])||FOTOS_DEFECTO[kind];
const BRAND_COLORS={Esika:"#e8590c",Cyzone:"#d6336c",Yanbal:"#7048e8",Lbel:"#495057",Maquillaje:"#1098ad"};
function placeholder(code,brand,kind){
  const c=BRAND_COLORS[brand]||"#868e96";
  const art=kind==="caja"
    ? `<path d="M28 38 L50 28 L72 38 L72 70 L50 80 L28 70 Z" fill="${c}" opacity=".9"/><path d="M28 38 L50 48 L72 38 M50 48 L50 80" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>`
    : `<rect x="44" y="18" width="12" height="20" rx="3" fill="#2b1a22"/><rect x="41" y="36" width="18" height="44" rx="6" fill="${c}"/><rect x="45" y="44" width="3" height="28" rx="1.5" fill="#fff" opacity=".5"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${c}" opacity=".12"/>${art}<text x="50" y="94" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="${c}">${code}</text></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}
function imgFallback(el){
  // 1) foto propia  2) foto por defecto  3) dibujo SVG
  if(!el.dataset.ph){el.dataset.ph=1;el.src=FOTOS_DEFECTO[el.dataset.kind]}
  else{el.onerror=null;el.src=placeholder(el.dataset.code,el.dataset.brand,el.dataset.kind)}
}
function imgTag(p,kind){
  return `<img loading="lazy" alt="${esc(p.name)} (${kind})" src="${foto(p,kind)}" data-code="${esc(p.code)}" data-brand="${esc(p.brand)}" data-kind="${kind}" onerror="imgFallback(this)">`;
}
function openViewer(code){
  const p=PRODUCTS.find(x=>x.code===code);if(!p)return;
  const c=C.counts[p.code];
  openSheet(`<h2>${esc(p.name)}</h2><div class="meta"><span class="tag">${esc(p.brand)}</span><span>${esc(p.code)} · ${esc(p.barcode)}</span></div>
    <div class="viewer"><figure>${imgTag(p,"caja")}<figcaption>📦 Empacada</figcaption></figure><figure>${imgTag(p,"tienda")}<figcaption>🏬 En la tienda</figcaption></figure></div>
    <div class="foot" style="margin-top:10px"><span class="lbl">Conteo</span><div class="stepper">
      <button class="minus" data-d="-1" data-c="${esc(p.code)}" data-keep="1">−</button><div class="qty" id="vq">${c??"–"}</div>
      <button class="plus" data-d="1" data-c="${esc(p.code)}" data-keep="1">+</button></div></div>
    <button class="btn ghost" id="closeV">Cerrar</button>`);
  $("#closeV").onclick=closeSheet;
}

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}

function setCount(code,v){
  if(v==null||v==="")delete C.counts[code];else C.counts[code]=Math.max(0,parseInt(v)||0);
  C.sentAt=null;save();
}

function filtered(){
  const q=norm($("#q").value.trim());
  return PRODUCTS.filter(p=>{
    if(brand==="__pend"&&C.counts[p.code]!=null)return false;
    if(brand!=="Todas"&&brand!=="__pend"&&p.brand!==brand)return false;
    return !q||norm(p.name+" "+p.code+" "+p.brand).includes(q)||z(p.barcode).includes(z(q));
  });
}

function renderHeader(){
  $("#hola").textContent=tienda?`Hola ${tienda} 👋`:"Hola 👋";
  $("#fecha").textContent="Conteo de pestañinas · "+new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
  const n=Object.keys(C.counts).length,t=PRODUCTS.length;
  $("#bar").style.width=(n/t*100)+"%";
  $("#prog").classList.toggle("lit",n>0&&n<t);
  $("#ptxt").textContent=`${n} de ${t} contados`;
  $("#units").textContent=`${Object.values(C.counts).reduce((a,b)=>a+b,0)} unidades`;
  $("#estado").textContent=C.sentAt?"✓ Enviado "+new Date(C.sentAt).toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}):"Sin enviar";
}
function renderChips(){
  const pend=PRODUCTS.filter(p=>C.counts[p.code]==null).length;
  const brands=["Todas",...new Set(PRODUCTS.map(p=>p.brand))];
  $("#chips").innerHTML=brands.map(b=>`<button class="chip ${b===brand?"on":""}" data-b="${esc(b)}">${esc(b)}</button>`).join("")
    +`<button class="chip ${brand==="__pend"?"on":""}" data-b="__pend">⏳ Sin contar (${pend})</button>`;
}
function render(){
  renderHeader();renderChips();
  const items=filtered();
  $("#list").innerHTML=items.length?items.map(p=>{
    const c=C.counts[p.code];
    return `<div class="item ${c!=null?"done":""}" data-code="${esc(p.code)}">
      <div class="thumbs" data-view="${esc(p.code)}" title="Ver fotos">
        <div class="thumb">${imgTag(p,"caja")}<em>CAJA</em></div>
        <div class="thumb">${imgTag(p,"tienda")}<em>TIENDA</em></div>
      </div>
      <div data-view="${esc(p.code)}" style="cursor:pointer"><div class="name">${esc(p.name)}</div>
        <div class="meta"><span class="tag">${esc(p.brand)}</span><span>${esc(p.code)}</span><span>· ${esc(p.barcode)}</span></div></div>
      <div class="foot"><span class="lbl">${c!=null?"✓ Contado":"Conteo"}</span>
      <div class="stepper">
        <button class="minus" data-d="-1" data-c="${esc(p.code)}" aria-label="Restar">−</button>
        <input class="qty" type="number" inputmode="numeric" min="0" placeholder="–" value="${c??""}" data-in="${esc(p.code)}" aria-label="Cantidad">
        <button class="plus" data-d="1" data-c="${esc(p.code)}" aria-label="Sumar">+</button>
      </div></div></div>`}).join(""):`<div class="empty">${brand==="__pend"?"¡Todo contado! 🎉":"Sin resultados 🔍"}</div>`;
}

function openSheet(html){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#sheet").classList.add("open");$("#backdrop").classList.add("open")}
function closeSheet(){$("#sheet").classList.remove("open");$("#backdrop").classList.remove("open")}

function askTienda(force){
  if(tienda&&!force)return;
  openSheet(`<h2>¿Qué tienda está contando?</h2>
    <div class="stores">${TIENDAS.map(t=>`<button data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <input class="field" id="otra" placeholder="Otra tienda…" style="margin-top:10px">
    <button class="btn primary" id="okT">Continuar</button>`);
  $("#sheet").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>pickTienda(b.dataset.t));
  $("#okT").onclick=()=>{const v=$("#otra").value.trim();if(!v)return toast("Escribe o elige una tienda");pickTienda(v)};
}
function pickTienda(t){tienda=t;localStorage.setItem("pest_tienda",t);C=load();closeSheet();render();toast(`Hola ${t} 👋`)}

function reporte(){
  const d=new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric"});
  const n=Object.keys(C.counts).length,u=Object.values(C.counts).reduce((a,b)=>a+b,0);
  let txt=`📋 *Conteo pestañinas*\n🏬 Tienda: *${tienda}*\n📅 ${d}\n✅ ${n}/${PRODUCTS.length} referencias · ${u} unidades\n`;
  const byB={};PRODUCTS.forEach(p=>(byB[p.brand]??=[]).push(p));
  for(const [b,ps] of Object.entries(byB)){
    txt+=`\n*${b}*\n`+ps.map(p=>`• ${p.code} ${p.name}: ${C.counts[p.code]??"SIN CONTAR"}`).join("\n")+"\n";
  }
  return txt.trim()+"\n\n¡Gracias! 💗";
}
function csv(){
  const rows=[["Tienda","Fecha","Codigo Barra","Codigo","Nombre","Marca","Conteo"],...PRODUCTS.map(p=>[tienda,hoy(),p.barcode,p.code,p.name,p.brand,C.counts[p.code]??""])];
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n")],{type:"text/csv"}));
  a.download=`conteo_pestaninas_${norm(tienda).replace(/\s+/g,"_")}_${hoy()}.csv`;a.click();
}
function marcarEnviado(){
  C.sentAt=Date.now();save();render();
  const u=Object.values(C.counts).reduce((a,b)=>a+b,0);
  openSheet(`<div style="text-align:center;padding:16px 0 4px">
    <div style="font-size:3.5rem;line-height:1">💗</div>
    <h2 style="font-size:1.6rem;margin:10px 0 6px">¡Gracias, ${esc(tienda)}!</h2>
    <p style="color:var(--muted);margin:0">Tu conteo de hoy quedó enviado.<br><b style="color:var(--ink)">${Object.keys(C.counts).length} referencias · ${u} unidades</b></p>
    <button class="btn primary" id="okG" style="margin-top:20px">Listo</button></div>`);
  $("#okG").onclick=closeSheet;
}

function openSend(){
  if(!tienda)return askTienda(true);
  const pend=PRODUCTS.length-Object.keys(C.counts).length;
  const txt=reporte();
  openSheet(`<h2>Enviar conteo de hoy · ${esc(tienda)}</h2>
    ${pend?`<div class="warn">⚠️ Faltan <b>${pend}</b> referencias por contar. Se enviarán como "SIN CONTAR".</div>`:""}
    <div class="preview">${esc(txt)}</div>
    <button class="btn wa" id="wa">Enviar por WhatsApp</button>
    ${navigator.share?`<button class="btn primary" id="sh">Compartir…</button>`:""}
    <button class="btn ghost" id="cp">Copiar texto</button>
    <button class="btn ghost" id="dl">Descargar CSV</button>`);
  $("#wa").onclick=()=>{window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");marcarEnviado()};
  if(navigator.share)$("#sh").onclick=async()=>{try{await navigator.share({title:"Conteo pestañinas "+tienda,text:txt});marcarEnviado()}catch(e){}};
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("Copiado ✓")}catch(e){toast("No se pudo copiar")}};
  $("#dl").onclick=()=>{csv();toast("CSV descargado")};
}

// Escáner tipo teclado: cada lectura suma 1 al conteo
$("#q").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const v=z(e.target.value.trim());if(!v)return;
  const p=PRODUCTS.find(p=>z(p.barcode)===v||p.code===v.toUpperCase());
  if(!p){toast("Código no encontrado");return}
  e.target.value="";setCount(p.code,(C.counts[p.code]??0)+1);render();
  toast(`${p.code}: ${C.counts[p.code]}`);
  const el=document.querySelector(`.item[data-code="${CSS.escape(p.code)}"]`);
  if(el){el.classList.add("flash");el.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>el.classList.remove("flash"),900)}
});
$("#q").addEventListener("input",render);
$("#scanBtn").onclick=()=>{$("#q").value="";$("#q").focus();window.scrollTo({top:0});toast("Escanea: cada lectura suma 1")};
$("#sendBtn").onclick=openSend;
function openReset(){
  openSheet(`<h2>Reiniciar conteo de hoy</h2>
    <p style="color:var(--muted);margin:0">Esto cambia el conteo de ${esc(tienda||"esta tienda")} de hoy.</p>
    <div class="reset-opts">
      <button class="danger" id="rsBorrar">↺ Borrar todo<small>Todas las referencias vuelven a "sin contar"</small></button>
      <button id="rsCero">0 Poner todo en cero<small>Marca todas las referencias como contadas con 0</small></button>
      <button id="rsNo">Cancelar</button>
    </div>`);
  $("#rsBorrar").onclick=()=>{C.counts={};C.sentAt=null;save();closeSheet();render();toast("Conteo borrado")};
  $("#rsCero").onclick=()=>{PRODUCTS.forEach(p=>C.counts[p.code]=0);C.sentAt=null;save();closeSheet();render();toast("Todo en 0")};
  $("#rsNo").onclick=closeSheet;
}
$("#resetBtn").onclick=openReset;
$("#hola").onclick=()=>askTienda(true);
$("#backdrop").onclick=()=>{if(tienda)closeSheet()};

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-b]");if(b){brand=b.dataset.b;render();return}
  const d=e.target.closest("[data-d]");if(d){const c=d.dataset.c,cur=C.counts[d.dataset.c];
    setCount(c,cur==null?(+d.dataset.d>0?1:0):Math.max(0,cur+ +d.dataset.d));render();
    if(d.dataset.keep)$("#vq").textContent=C.counts[c];return}
  const v=e.target.closest("[data-view]");if(v){openViewer(v.dataset.view)}
});
document.addEventListener("change",e=>{const c=e.target.dataset?.in;if(c==null)return;setCount(c,e.target.value);render()});

render();askTienda(false);
</script>
<!-- TEMPORAL: selector de paletas (borrar al decidir) -->
<button class="pal-btn" id="palBtn" title="Probar paletas">🎨</button>
<div class="pal-box" id="palBox"><h3>Paletas (temporal)</h3><div id="palList"></div></div>
<script>
(function(){
  const P=[
    {id:'imagen',name:'Rosa fucsia (v3)',note:'Los colores de image.png',v:{bg:'#f5f2f4',ink:'#1f1a1d',muted:'#5f565b',line:'#e3dde0',brand:'#e23a85','brand-2':'#d81b72',soft:'#fde3ee',head:'linear-gradient(135deg,#d81b72,#e23a85)'}},
    {id:'difer',name:'DIFER (nueva)',note:'Magenta del logo + rosa',v:{bg:'#fff2f8',ink:'#3a0f22',muted:'#9a5b78',line:'#fad3e5',brand:'#c90e5d','brand-2':'#e7579c',soft:'#ffe3ef'}},
    {id:'difer-rosa',name:'DIFER rosa',note:'Encabezado rosa, texto magenta',v:{bg:'#fff2f8',ink:'#3a0f22',muted:'#9a5b78',line:'#fad3e5',brand:'#c90e5d','brand-2':'#e7579c',soft:'#ffe3ef',head:'#fe9bc7','head-ink':'#8a0a40'}},
    {id:'antigua',name:'Antigua',note:'La paleta anterior',v:{bg:'#fff7fa',ink:'#2b1a22',muted:'#8a6f7b',line:'#f1dbe4',brand:'#d6336c','brand-2':'#f06595',soft:'#f8e9ef'}},
    {id:'durazno',name:'Frambuesa y durazno',note:'Magenta + tono de las rosas',v:{bg:'#fff6f2',ink:'#3a1620',muted:'#9a6a6a',line:'#fbd9cc',brand:'#c90e5d','brand-2':'#f2836b',soft:'#ffe7dd'}},
    {id:'empolvado',name:'Rosa empolvado',note:'Más suave y elegante',v:{bg:'#fbf4f5',ink:'#3b2229',muted:'#8c6670',line:'#eed5dc',brand:'#b0476b','brand-2':'#d47f9a',soft:'#f6e4e9'}},
    {id:'ciruela',name:'Ciruela',note:'Más oscuro, contraste alto',v:{bg:'#fbf3f8',ink:'#2e1428',muted:'#7f5f77',line:'#ead0e2',brand:'#8e2c6e','brand-2':'#c2549a',soft:'#f3e1ee'}}
  ];
  const root=document.documentElement, list=document.getElementById('palList');
  function apply(p){
    root.style.setProperty('--head',p.v.head||'linear-gradient(135deg,var(--brand),var(--brand-2))');
    root.style.setProperty('--head-ink',p.v['head-ink']||'#fff');
    for(const k in p.v){ if(k!=='head'&&k!=='head-ink') root.style.setProperty('--'+k,p.v[k]); }
    document.querySelector('meta[name=theme-color]').content=(p.v.head&&p.v.head[0]==='#')?p.v.head:(p.v['brand-2']||p.v.brand);
    localStorage.setItem('paleta2',p.id);
    list.querySelectorAll('.pal-opt').forEach(b=>b.classList.toggle('on',b.dataset.id===p.id));
  }
  list.innerHTML=P.map(p=>`<button class="pal-opt" data-id="${p.id}"><span class="pal-sw">${[p.v.brand,p.v['brand-2'],p.v.head||p.v.soft,p.v.bg,p.v.ink].map(c=>`<i style="background:${c}"></i>`).join('')}</span><span>${p.name}<small>${p.note}</small></span></button>`).join('');
  list.onclick=e=>{const b=e.target.closest('.pal-opt'); if(b) apply(P.find(p=>p.id===b.dataset.id));};
  document.getElementById('palBtn').onclick=()=>document.getElementById('palBox').classList.toggle('open');
  apply(P.find(p=>p.id===localStorage.getItem('paleta2'))||P[0]);
})();
</script>
